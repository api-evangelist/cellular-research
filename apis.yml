name: Cellular Research
description: Cellular Research, Inc. was a single-cell genomics company backed by Canaan Partners
  that developed molecular-indexing (its "Precise" assay) technology for high-throughput single-cell
  gene expression analysis. The company was acquired by Becton Dickinson (BD) in 2015 and its technology
  became the foundation of the BD Rhapsody single-cell analysis platform. As a life-sciences instrument
  and reagent company folded into BD, it exposes no independent public developer portal, API, or
  machine-readable API surface; this profile is retained as a portfolio-lead identity record only.
